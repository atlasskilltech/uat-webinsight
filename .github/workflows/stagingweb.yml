name: Deploy to EC2 Server of atlasliving(Staging UAT-WebInsights)

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/uat-webinsight

            # Get the latest code for this branch
            git fetch origin staging
            git reset --hard origin/staging

            # Install ALL dependencies (the Next.js build needs devDependencies
            # such as typescript and tailwindcss — a prod-only install fails)
            npm ci

            # Ensure the MySQL schema exists (CREATE TABLE IF NOT EXISTS — safe
            # to run every deploy). Reads DB_* / DATABASE_URL from the .env file.
            npm run db:init

            # Build the production bundle (.next/) that `next start` serves
            npm run build

            # Start (or restart) the app under pm2. There is no src/app.js —
            # this is a Next.js app, started via `npm start` (-> next start),
            # which listens on PORT from .env.
            pm2 restart uat-webinsight --update-env || pm2 start npm --name uat-webinsight -- start

            pm2 save
