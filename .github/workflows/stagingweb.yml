name: Deploy to EC2 Server of atlasliving(Staging UAT-WebInsights)

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/uat-webinsight

            # Get the latest code for this branch
            git fetch origin staging
            git reset --hard origin/staging

            # Install ALL dependencies (the Next.js build needs devDependencies
            # such as typescript and tailwindcss — a prod-only install fails)
            npm ci

            # Ensure the MySQL schema exists (CREATE TABLE IF NOT EXISTS — safe
            # to run every deploy). Reads DB_* / DATABASE_URL from the .env file.
            npm run db:init

            # Build the production bundle (.next/) that `next start` serves
            npm run build

            # Start or reload the app under pm2 using ecosystem.config.js, which
            # pins the working directory (/home/ubuntu/uat-webinsight) and port
            # (9091, the proxy target) so it can't start from the wrong dir/port.
            pm2 startOrReload ecosystem.config.js --update-env

            pm2 save
